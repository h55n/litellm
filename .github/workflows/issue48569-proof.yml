name: Issue 48569 fork proof
on:
  push:
    branches: [test-48569-delegated-oauth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install locked proxy test environment
        run: |
          set -euo pipefail
          uv sync --frozen --extra proxy --group proxy-dev --no-install-project
          export PATH="$PWD/.venv/bin:$PATH"
          prisma generate --schema litellm/proxy/schema.prisma
      - name: Run complete affected test files
        run: |
          set -euo pipefail
          mkdir -p proof/logs
          .venv/bin/python -m pytest tests/unit/proxy/mcp_server/test_mcp_server_manager.py tests/unit/proxy/mcp_server/test_mcp_oauth_passthrough_tools.py tests/unit/proxy/mcp_server/faults/test_list_outcomes.py -q 2>&1 | tee proof/logs/affected-tests.log
      - name: Run real local HTTP reproduction
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" .venv/bin/python proof/issue48569_repro.py 2>&1 | tee proof/logs/local-http.log
      - name: Check production formatting and lint
        run: |
          set -euo pipefail
          .venv/bin/ruff format --check litellm/proxy/mcp_server/mcp_server_manager.py
          .venv/bin/ruff check litellm/proxy/mcp_server/mcp_server_manager.py
          .venv/bin/python scripts/check_mcp_operation_boundary.py
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: issue48569-proof
          path: proof/logs/
