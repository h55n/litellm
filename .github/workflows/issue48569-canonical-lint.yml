name: Issue 48569 canonical lint proof
on:
  push:
    branches: [test-48569-canonical-lint]
    paths: [.github/workflows/issue48569-canonical-lint.yml]
permissions:
  contents: read
  actions: read
jobs:
  canonical-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BASE_REF: f6f49d16cc2422d2a83c93c074e0ac4d6a889cc5
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PYTHON_DOTENV_DISABLED: '1'
      LINT_JOBS: '2'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Verify dependency lock
        run: uv lock --check
      - name: Run canonical lint without bypasses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make lint 2>&1 | tee "$RUNNER_TEMP/issue48569-canonical-lint.log"
